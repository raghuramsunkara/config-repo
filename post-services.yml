server:
  port: 8081

spring:
  application:
    name: post-services

  datasource:
    url: jdbc:mysql://localhost:3306/post_db
    username: root
    password: "@Mysql143"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: refresh

post:
  welcome-message: "welcome to learning"
